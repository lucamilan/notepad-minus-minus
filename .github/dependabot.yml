version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Lascia "invecchiare" le nuove versioni prima di proporle: riduce il rischio di pacchetti compromessi.
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
